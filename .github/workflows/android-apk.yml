name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android-twa/app/build.gradle'
      - 'icons/halloween-icon-512.png'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Android launcher icon
        run: |
          mkdir -p android-twa/app/src/main/res/drawable
          cp icons/halloween-icon-512.png android-twa/app/src/main/res/drawable/ic_launcher.png

      - name: Restore signing key
        env:
          H3_KEYSTORE_BASE64: ${{ secrets.H3_KEYSTORE_BASE64 }}
        run: |
          test -n "$H3_KEYSTORE_BASE64" || { echo "Missing H3_KEYSTORE_BASE64 secret"; exit 1; }
          echo "$H3_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/halloween3-release.keystore"

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION_NAME="$(sed -n "s/^[[:space:]]*versionName '\([^']*\)'.*/\1/p" android-twa/app/build.gradle | head -n1)"
          VERSION_CODE="$(sed -n "s/^[[:space:]]*versionCode \([0-9][0-9]*\).*/\1/p" android-twa/app/build.gradle | head -n1)"
          test -n "$VERSION_NAME" || { echo "Cannot read versionName"; exit 1; }
          test -n "$VERSION_CODE" || { echo "Cannot read versionCode"; exit 1; }
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        env:
          H3_KEYSTORE_PATH: ${{ runner.temp }}/halloween3-release.keystore
          H3_KEYSTORE_PASSWORD: ${{ secrets.H3_KEYSTORE_PASSWORD }}
          H3_KEY_ALIAS: ${{ secrets.H3_KEY_ALIAS }}
          H3_KEY_PASSWORD: ${{ secrets.H3_KEY_PASSWORD }}
        run: gradle --no-daemon -p android-twa :app:assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Halloween-3.0-APK
          path: android-twa/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish APK as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.app_version.outputs.version_name }}
        shell: bash
        run: |
          APK="$RUNNER_TEMP/Halloween-3.0.apk"
          TAG="android-v${VERSION_NAME}"
          cp android-twa/app/build/outputs/apk/release/app-release.apk "$APK"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Halloween 3.0 Android v${VERSION_NAME}" \
              --notes "Aktualna podpisana wersja APK aplikacji Halloween 3.0."
          fi

      - name: Publish in-app update metadata
        env:
          VERSION_NAME: ${{ steps.app_version.outputs.version_name }}
          VERSION_CODE: ${{ steps.app_version.outputs.version_code }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          mkdir -p downloads
          cat > downloads/android-version.json <<EOF
          {
            "version": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/android-v${VERSION_NAME}/Halloween-3.0.apk"
          }
          EOF
          git add downloads/android-version.json
          if git diff --cached --quiet; then
            echo "Android update metadata already current."
            exit 0
          fi
          git commit -m "Publish Android update metadata v${VERSION_NAME}"
          git push origin HEAD:main
