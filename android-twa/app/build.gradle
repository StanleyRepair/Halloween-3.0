plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.stanleyrepair.halloween3'
    compileSdk 36

    defaultConfig {
        applicationId 'pl.stanleyrepair.halloween3'
        minSdk 26
        targetSdk 36
        versionCode 15
        versionName '1.0.14'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            def keyPath = System.getenv('H3_KEYSTORE_PATH')
            def storePass = System.getenv('H3_KEYSTORE_PASSWORD')
            def keyAliasName = System.getenv('H3_KEY_ALIAS')
            def keyPass = System.getenv('H3_KEY_PASSWORD')
            if (keyPath && storePass && keyAliasName && keyPass) {
                storeFile file(keyPath)
                storePassword storePass
                keyAlias keyAliasName
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('H3_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.3'
}
